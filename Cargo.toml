[package]
name = "prompt-lens"
version = "0.1.0"
edition = "2021"
description = "CLI tool that visualizes prompt structure, tokenizes in real-time, and suggests optimizations"
authors = ["fuleinist"]
license = "MIT"

[[bin]]
name = "prompt-lens"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-segmentation = "1.10"
regex = "1"
atty = "0.2"
tiktoken-rs = { version = "0.5", optional = true }

[features]
default = []
tiktoken = ["tiktoken-rs"]

[dev-dependencies]